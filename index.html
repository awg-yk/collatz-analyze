<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>コラッツ予想 解析ツール</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  h1 {
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  p.desc {
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 24px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .input-row {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  label {
    color: var(--muted);
    font-size: 0.9rem;
  }
  input[type="text"] {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 1rem;
    width: 320px;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 9px 18px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
  }
  button:hover { opacity: 0.9; }
  .error {
    color: #f87171;
    margin-top: 8px;
    font-size: 0.9rem;
  }
  .stats {
    display: flex;
    gap: 24px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 16px;
    min-width: 120px;
  }
  .stat .label { color: var(--muted); font-size: 0.8rem; }
  .stat .value { font-size: 1.2rem; font-weight: 600; margin-top: 2px; }
  canvas {
    width: 100%;
    height: 320px;
    background: var(--bg);
    border-radius: 6px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }
  th, td {
    padding: 6px 10px;
    text-align: right;
    border-bottom: 1px solid var(--border);
  }
  th:first-child, td:first-child { text-align: left; }
  thead th {
    color: var(--muted);
    font-weight: 600;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  .table-wrap {
    max-height: 400px;
    overflow-y: auto;
  }
  select {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 6px;
    font-size: 0.95rem;
  }
  button:disabled {
    opacity: 0.45;
    cursor: default;
  }
  h2 {
    font-size: 1.05rem;
    margin-top: 0;
    color: var(--muted);
  }
</style>
</head>
<body>
<div class="container">
  <h1>コラッツ予想 解析ツール</h1>
  <p class="desc">正の整数を入力すると、コラッツ数列(n が偶数なら n/2、奇数なら 3n+1 を 1 になるまで繰り返す)の推移をグラフと表で表示します。</p>

  <div class="panel">
    <div class="input-row">
      <label for="start-number">開始値 (正の整数、50桁以上も可):</label>
      <input type="text" inputmode="numeric" id="start-number" value="27" pattern="[0-9]*">
      <button id="run-btn">計算する</button>
    </div>
    <div id="error" class="error" style="display:none;"></div>
    <div class="stats" id="stats" style="display:none;">
      <div class="stat"><div class="label">試行回数(ステップ数)</div><div class="value" id="stat-steps">-</div></div>
      <div class="stat"><div class="label">最大値</div><div class="value" id="stat-max">-</div></div>
      <div class="stat"><div class="label">開始値</div><div class="value" id="stat-start">-</div></div>
      <div class="stat"><div class="label">偶数の回数</div><div class="value" id="stat-even">-</div></div>
      <div class="stat"><div class="label">奇数の回数</div><div class="value" id="stat-odd">-</div></div>
    </div>
  </div>

  <div class="panel" id="playback-panel" style="display:none;">
    <h2>再生(開始値を1つずつ進める)</h2>
    <p class="desc" style="margin-bottom:12px;">開始値を奇数で1つずつ進めながら(例: 27 → 29 → 31 → …)、そのつどコラッツ数列全体を計算してグラフ・表を更新します。数によって軌道の形がどう変わるかを見比べられます。</p>
    <div class="input-row">
      <button id="play-btn">再生</button>
      <button id="pause-btn" disabled>一時停止</button>
      <button id="step-btn">次の開始値へ</button>
      <button id="playback-reset-btn">入力値に戻す</button>
      <label for="speed">速度:</label>
      <select id="speed">
        <option value="2000">0.5 件/秒</option>
        <option value="1000" selected>1 件/秒</option>
        <option value="500">2 件/秒</option>
        <option value="200">5 件/秒</option>
        <option value="50">20 件/秒</option>
      </select>
    </div>
    <div class="stats" style="margin-top:16px;">
      <div class="stat"><div class="label">再生した開始値の数</div><div class="value" id="play-count">0</div></div>
    </div>
    <div class="stat" style="margin-top:12px; width:100%; word-break: break-all;">
      <div class="label">現在の開始値</div>
      <div class="value" id="play-value" style="font-size:1.1rem;">-</div>
    </div>
  </div>

  <div class="panel">
    <h2>グラフ (試行回数 vs 値)</h2>
    <canvas id="chart"></canvas>
  </div>

  <div class="panel">
    <h2>表</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>ステップ</th><th>値</th><th>偶数/奇数</th></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
function collatzSequence(n) {
  const seq = [n];
  while (n !== 1n) {
    n = (n % 2n === 0n) ? n / 2n : 3n * n + 1n;
    seq.push(n);
    if (seq.length > 100000) break; // safety guard
  }
  return seq;
}

// 現在表示中の数列(開始値の軌道)。再生は「開始値そのもの」を1つずつ進める。
let currentSeq = [];
let currentStart = null; // BigInt
let playedCount = 0;
let playTimer = null;

function drawChart(canvas, seq) {
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const w = rect.width, h = rect.height;
  ctx.clearRect(0, 0, w, h);
  if (seq.length === 0) return;

  const padding = { top: 20, right: 20, bottom: 30, left: 70 };
  const plotW = w - padding.left - padding.right;
  const plotH = h - padding.top - padding.bottom;

  const maxValBig = seq.reduce((a, b) => (b > a ? b : a), seq[0]);
  const maxVal = Number(maxValBig);
  const maxStep = seq.length - 1;

  const xScale = (i) => padding.left + (plotW * i) / (maxStep || 1);
  const yScale = (v) => padding.top + plotH - (plotH * v) / (maxVal || 1);

  // axes
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(padding.left, padding.top);
  ctx.lineTo(padding.left, padding.top + plotH);
  ctx.lineTo(padding.left + plotW, padding.top + plotH);
  ctx.stroke();

  // y labels + grid
  ctx.fillStyle = '#94a3b8';
  ctx.font = '11px sans-serif';
  ctx.textAlign = 'right';
  const yTicks = 5;
  for (let t = 0; t <= yTicks; t++) {
    const v = (maxVal * t) / yTicks;
    const y = yScale(v);
    ctx.fillText(formatAxisValue(v), padding.left - 8, y + 3);
    ctx.strokeStyle = 'rgba(51,65,85,0.4)';
    ctx.beginPath();
    ctx.moveTo(padding.left, y);
    ctx.lineTo(padding.left + plotW, y);
    ctx.stroke();
  }

  // x labels
  ctx.textAlign = 'center';
  ctx.fillStyle = '#94a3b8';
  const xTicks = Math.min(10, maxStep);
  for (let t = 0; t <= xTicks; t++) {
    const step = Math.round((maxStep * t) / (xTicks || 1));
    ctx.fillText(step, xScale(step), padding.top + plotH + 18);
  }

  // line
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  seq.forEach((v, i) => {
    const x = xScale(i), y = yScale(Number(v));
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
}

// 巨大な値でも軸ラベルが破綻しないよう、大きい場合は指数表記にする。
function formatAxisValue(v) {
  if (!isFinite(v)) return '-';
  if (v >= 1e15) return v.toExponential(1);
  return Math.round(v).toLocaleString();
}

function renderTable(tbody, seq) {
  const rows = seq.map((v, i) => {
    const parity = (v % 2n === 0n) ? '偶数' : '奇数';
    return `<tr><td>${i}</td><td>${v.toString()}</td><td>${parity}</td></tr>`;
  }).join('');
  tbody.innerHTML = rows;
}

function countParity(seq) {
  let even = 0, odd = 0;
  for (const v of seq) {
    if (v % 2n === 0n) even++;
    else odd++;
  }
  return { even, odd };
}

// 指定した開始値 n のコラッツ数列を計算し、グラフ・表・統計をまとめて更新する。
function renderForStart(n) {
  currentStart = n;
  currentSeq = collatzSequence(n);
  const maxValBig = currentSeq.reduce((a, b) => (b > a ? b : a), currentSeq[0]);

  document.getElementById('stat-steps').textContent = (currentSeq.length - 1).toLocaleString();
  document.getElementById('stat-max').textContent = maxValBig.toString();
  document.getElementById('stat-start').textContent = n.toString();
  const { even, odd } = countParity(currentSeq);
  document.getElementById('stat-even').textContent = even.toLocaleString();
  document.getElementById('stat-odd').textContent = odd.toLocaleString();
  document.getElementById('stats').style.display = 'flex';

  document.getElementById('play-value').textContent = n.toString();
  document.getElementById('play-count').textContent = playedCount.toLocaleString();

  drawChart(document.getElementById('chart'), currentSeq);
  renderTable(document.getElementById('table-body'), currentSeq);
}

function stopPlayback() {
  if (playTimer) {
    clearInterval(playTimer);
    playTimer = null;
  }
  document.getElementById('play-btn').disabled = false;
  document.getElementById('pause-btn').disabled = true;
}

// 現在の開始値の次の奇数へ進める(例: 27 → 29 → 31 → …)。
function advanceToNextStart() {
  playedCount++;
  renderForStart(currentStart + 2n);
}

function startPlayback() {
  if (playTimer || currentStart === null) return;
  const interval = Number(document.getElementById('speed').value);
  document.getElementById('play-btn').disabled = true;
  document.getElementById('pause-btn').disabled = false;
  playTimer = setInterval(advanceToNextStart, interval);
}

function run() {
  const input = document.getElementById('start-number');
  const errorEl = document.getElementById('error');
  const statsEl = document.getElementById('stats');
  const raw = input.value.trim();

  errorEl.style.display = 'none';

  if (!/^[0-9]+$/.test(raw) || /^0+$/.test(raw)) {
    errorEl.textContent = '1以上の整数を入力してください(桁数の制限はありません)。';
    errorEl.style.display = 'block';
    statsEl.style.display = 'none';
    document.getElementById('playback-panel').style.display = 'none';
    return;
  }

  stopPlayback();
  playedCount = 0;
  document.getElementById('playback-panel').style.display = 'block';
  renderForStart(BigInt(raw));
}

document.getElementById('run-btn').addEventListener('click', run);
document.getElementById('start-number').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') run();
});
document.getElementById('play-btn').addEventListener('click', startPlayback);
document.getElementById('pause-btn').addEventListener('click', stopPlayback);
document.getElementById('step-btn').addEventListener('click', () => {
  stopPlayback();
  advanceToNextStart();
});
document.getElementById('playback-reset-btn').addEventListener('click', () => {
  stopPlayback();
  run();
});
// 再生中に速度を変えたら、その場で新しい間隔に切り替える
document.getElementById('speed').addEventListener('change', () => {
  if (playTimer) {
    stopPlayback();
    startPlayback();
  }
});
window.addEventListener('resize', () => {
  if (currentSeq.length > 0) drawChart(document.getElementById('chart'), currentSeq);
});

run();

</script>
</body>
</html>
